<script>


    //menu lateral (mobile)
    function ExpandeMenu() {
        var menulateral = document.querySelector(".menulateral");

        if (menulateral.classList.contains('expande')) {
            menulateral.classList.remove('expande');
        } else {
            menulateral.classList.add('expande');
        }
    }

    //menu lateral (desktop)

    function MenuAberto() {

        var menulateral = document.querySelector(".menulateral")
        menulateral.classList.add('expande');

    }

    function MenuFechado() {

        var menulateral = document.querySelector(".menulateral")
        menulateral.classList.remove('expande');
    }




    document.addEventListener("DOMContentLoaded", () => {
        carregarCardapio(); // Carrega o cardápio quando a página for carregada


        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", function () {
                // Alterna a aba ativa e a categoria exibida
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                this.classList.add("active");

                const categoria = this.getAttribute("data-tab");
                exibirCategoria(categoria); // Mostra os produtos da categoria clicada
            });
        });
    });

    let produtosPorCategoria = {}; // Variável global para armazenar produtos





    // Função para carregar os produtos do cardápio do servidor
    async function carregarCardapio() {
        try {
            const response = await fetch('/pedidos?json=true');
            const produtos = await response.json();

            produtosPorCategoria = { lanches: [], bebidas: [], pizzas: [], porcoes: [] }; // Inicializa as categorias

            produtos.forEach(produto => {
                const categoria = produto.tipo_produto.toLowerCase();
                if (produtosPorCategoria[categoria]) {
                    produtosPorCategoria[categoria].push(produto);
                }
            });

            // Verifique se a variável 'produtosPorCategoria' está preenchida corretamente
            console.log(produtosPorCategoria); // Adicione esta linha para depuração

            // Exibe a categoria ativa ("lanches" por padrão) após carregar os produtos
            exibirCategoria("lanches");
        } catch (error) {
            console.error("Erro ao carregar o cardápio:", error);
        }
    }


    // Função para atualizar o campo oculto com os itens do pedido
    function updateOrderItemsData() {
        const orderItemsData = document.getElementById('order-items-data');
        orderItemsData.value = JSON.stringify(order); // Converte o array de itens em JSON
    }



    // Função para exibir produtos de uma categoria específica
    function exibirCategoria(categoria) {
        const conteudoCardapio = document.getElementById("cardapio-content");

        if (!conteudoCardapio) {
            console.error("Erro: Elemento 'cardapio-content' não encontrado.");
            return;
        }

        conteudoCardapio.innerHTML = ""; // Limpa o conteúdo atual

        const produtos = produtosPorCategoria[categoria];

        if (produtos && produtos.length > 0) {
            produtos.forEach(produto => {
                const itemHTML = `
                <div class="item">
                    <div class="item-details">
                        <h3>${produto.nome_produto} - R$${produto.preco_produto}</h3>
                        <p>${produto.descricao_produto}</p>
                    </div>
                    <div class="item-img">
                        <img src="${produto.imagem_produto || 'css/imgs/logosemnome2.png'}" alt="${produto.nome_produto}">
                    </div>
                    <button class="add-to-order"><span class="material-symbols-outlined">add</span></button>
                </div>
            `;
                conteudoCardapio.insertAdjacentHTML("beforeend", itemHTML);
            });





            // Reatribui os eventos de clique para os botões "Adicionar ao carrinho"
            document.querySelectorAll('.add-to-order').forEach(button => {
                button.addEventListener('click', function () {
                    const itemElement = this.closest('.item');
                    const itemName = itemElement.querySelector('.item-details h3').innerText.split(' - ')[0];
                    const itemPrice = parseFloat(itemElement.querySelector('.item-details h3').innerText.split(' - ')[1].replace('R$', '').replace(',', '.'));

                    // Verifica se o item já está no carrinho
                    const existingItem = order.find(item => item.name === itemName);

                    if (existingItem) {
                        existingItem.quantity++;
                    } else {
                        order.push({ name: itemName, price: itemPrice, quantity: 1 });
                    }

                    updateOrderIcon();
                    updateOrderArea();

                    // Atualiza o campo oculto
                    updateOrderItemsData();
                });
            });
        } else {
            conteudoCardapio.innerHTML = "<p>Nenhum item encontrado nesta categoria.</p>";
        }
    }



    //popupForm CADASTRO DE PRODUTOS --------------------------

    document.addEventListener("DOMContentLoaded", function () {
        var popupForm = document.getElementById("popupForm");
        var addButton = document.getElementById("add_button");
        var closeFormButton = document.getElementById("closeFormButton");

        addButton.addEventListener("click", function () {
            popupForm.style.display = "flex";
        });

        closeFormButton.addEventListener("click", function () {
            popupForm.style.display = "none";
        });

        window.addEventListener("click", function (event) {
            if (event.target === popupForm) {
                popupForm.style.display = "none";
            }
        });



    });


       // Função para abrir e fechar o POP-UP DE PEDIDOS------------------------------------
       document.querySelector('.order-icon').addEventListener('click', function () {
        document.querySelector('.overlay').style.display = 'block';
        document.querySelector('.order-popup').style.display = 'flex';
    });

    document.getElementById('close-order-popup').addEventListener('click', function () {
        document.querySelector('.overlay').style.display = 'none';
        document.querySelector('.order-popup').style.display = 'none';
    });










    let order = [];  // Array para armazenar os itens no carrinho
    let total = 0.0;  // Variável para armazenar o total do pedido







    // Função para atualizar o ícone do carrinho (quantidade de itens no carrinho)
    function updateOrderIcon() {
        const orderCount = order.reduce((acc, item) => acc + item.quantity, 0);
        document.querySelector('.order-icon .order-count').innerText = orderCount;
    }




    // Função para atualizar a área de itens no carrinho
    function updateOrderArea() {
        const orderItemsContainer = document.querySelector('.order-items');
        orderItemsContainer.innerHTML = '';  // Limpa a lista de itens no carrinho

        order.forEach(item => {
            const orderItemDiv = document.createElement('div');
            orderItemDiv.classList.add('order-item');

            const itemNameP = document.createElement('p');
            itemNameP.innerText = `${item.name} x${item.quantity}`;  // Exibe o nome e a quantidade

            // Cria o campo de input para alterar a quantidade
            const itemQuantityInput = document.createElement('input');
            itemQuantityInput.type = 'number';
            itemQuantityInput.value = item.quantity;
            itemQuantityInput.min = 1;  // Não permite valores abaixo de 1
            itemQuantityInput.addEventListener('change', function () {
                const newQuantity = parseInt(this.value);
                item.quantity = newQuantity;  // Atualiza a quantidade do item
                updateOrderIcon();
                updateOrderArea();
            });

            // Adiciona o nome e a quantidade ao carrinho
            orderItemDiv.appendChild(itemQuantityInput);
            orderItemDiv.appendChild(itemNameP);

            orderItemsContainer.appendChild(orderItemDiv);
        });

        // Atualiza o total do pedido
        total = order.reduce((acc, item) => acc + item.price * item.quantity, 0).toFixed(2);
        document.getElementById('order-total-value').innerText = total.replace('.', ',');
    }










    document.getElementById('send-order').addEventListener('click', function (event) {
        event.preventDefault();

        const numeroMesa = document.querySelector('#order-table').value;

        // Verificar se o campo 'numero_mesa' foi preenchido
        if (!numeroMesa) {
            alert('Por favor, preencha o número da mesa.');
            return;
        }

        // Verificar se os itens do pedido não estão vazios
        if (order.length === 0) {
            alert('Por favor, adicione pelo menos um item ao pedido.');
            return;
        }


        const observacoes = document.querySelector('#order-observations').value;

        // Calcular o valor total do pedido, assumindo que "price" é a propriedade de cada item com o preço
        const totalPedido = order.reduce((total, item) => {
            // Verifique se "item.price" existe e se "item.quantity" está correto
            return total + (item.price * item.quantity);
        }, 0);

        // Enviar os dados para o backend
        fetch('/pedidos', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                numero_mesa: numeroMesa,
                obs_pedido: observacoes,
                itens_pedido: order.map(item => ({
                    nome_produto_item_pedido: item.name, // Nome do produto
                    quantidade_item_pedido: item.quantity, // Quantidade do item
                    preco_item_pedido: item.price // Preço do item (se necessário no backend)
                })),
                total_pedido: totalPedido // Total calculado do pedido
            })
        })
            .then(response => response.json())
            .then(data => {
                alert('Pedido enviado com sucesso!');
                order = [];  // Limpa o carrinho após o envio
                updateOrderArea();
                updateOrderIcon();

                // Fechar o pop-up após o envio
                const popUp = document.querySelector('#order-popup');
                if (popUp) {
                    popUp.style.display = 'none'; // Esconde o pop-up, altere conforme sua estrutura
                }

            })
            .catch(error => {
                alert('Erro ao enviar o pedido.');
                console.error(error);
            });
    });


</script>
